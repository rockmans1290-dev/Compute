name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          mkdir -p /tmp/wrappergen
          echo 'plugins {}' > /tmp/wrappergen/build.gradle
          echo 'rootProject.name = "temp"' > /tmp/wrappergen/settings.gradle
          cd /tmp/wrappergen
          gradle wrapper --gradle-version=8.7
          cd $GITHUB_WORKSPACE
          cp /tmp/wrappergen/gradlew .
          mkdir -p gradle/wrapper
          cp /tmp/wrappergen/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          cp /tmp/wrappergen/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: casio-calculator-apk
          path: app/build/outputs/apk/debug/app-debug.apk